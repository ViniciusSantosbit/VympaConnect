project_id = "vympa-connect-auth-local"
[api]
enabled = true
port = 54321
schemas = ["public"]
[db]
port = 54322
shadow_port = 54320
major_version = 17
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth/confirm"]
jwt_expiry = 600
enable_signup = false
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
minimum_password_length = 12
[auth.email]
# A CLI usa esta opção para habilitar o provedor de e-mail, inclusive login.
# O cadastro público continua bloqueado por [auth].enable_signup = false.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
[auth.email.template.invite]
subject = "Convite VYMPA Connect (local)"
content_path = "./supabase/templates/invite.html"
[auth.email.template.recovery]
subject = "Recuperar acesso VYMPA Connect (local)"
content_path = "./supabase/templates/recovery.html"
[auth.mfa]
max_enrolled_factors = 2
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sessions]
timebox = "8h"
inactivity_timeout = "1h"
